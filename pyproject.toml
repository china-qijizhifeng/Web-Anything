[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webanything"
version = "0.1.0a1"
description = "Reproducible source-grounded Web environment construction pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "WebAnything contributors" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48,<2", "lxml>=5,<7"]
visual = ["playwright>=1.48,<2", "Pillow>=12.3,<13", "cryptography>=50,<51"]
builder = [
  "Flask==3.1.3",
  "Flask-Bcrypt==1.0.1",
  "Flask-Login==0.6.3",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-WTF==1.2.2",
  "Jinja2==3.1.6",
  "Pillow==12.3.0",
  "SQLAlchemy==2.0.36",
  "WTForms==3.2.1",
  "email-validator==2.2.0",
  "requests==2.33.0",
  "pyarrow==24.0.0",
]
e2b = ["e2b>=2.20,<3"]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]

[project.scripts]
webanything = "webanything.cli:main"

[project.urls]
Homepage = "https://china-qijizhifeng.github.io/Web-Anything/"
Paper = "https://arxiv.org/abs/2610.37786"
Repository = "https://github.com/china-qijizhifeng/Web-Anything"
Documentation = "https://github.com/china-qijizhifeng/Web-Anything#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipeline-tools/interaction-verifier-v1/tests"]
addopts = "-q"
pythonpath = ["."]
